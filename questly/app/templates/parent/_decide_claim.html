<div class="decide">
  <form method="post" action="{{ url_for('parent.decide_claim_route', claim_id=c._id) }}">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button class="btn btn--go btn--sm" type="submit" name="decision" value="approve">Done +100%</button>
  </form>
  <form method="post" action="{{ url_for('parent.decide_claim_route', claim_id=c._id) }}">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button class="btn btn--ghost btn--sm" type="submit" name="decision" value="partial">Halfway +25%</button>
  </form>
  <form method="post" action="{{ url_for('parent.decide_claim_route', claim_id=c._id) }}">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button class="btn btn--ghost btn--sm" type="submit" name="decision" value="not_done">Not done &minus;50%</button>
  </form>
</div>
